<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Transport – Route Map</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fafaf9;
    --line: #ddd9d0;
    --accent: #1e5c4a;
    --accent-soft: #e5efe9;
    --muted: #6b6b63;
    --warn: #9a5a12;
    --warn-bg: #fbf1e2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }

  .app {
    display: flex;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: #fff;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header { padding: 16px 16px 10px; border-bottom: 1px solid var(--line); }
  .sidebar-header h1 { font-size: 1.05rem; margin: 0 0 2px; }
  .sidebar-header p { font-size: 0.78rem; color: var(--muted); margin: 0; }

  .setup-banner {
    background: var(--warn-bg);
    color: var(--warn);
    font-size: 0.78rem;
    padding: 10px 12px;
    margin: 10px;
    border-radius: 8px;
    border: 1px solid #e8c98f;
    display: none;
  }

  .bus-list { flex: 1; overflow-y: auto; padding: 8px; }
  .bus-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    margin-bottom: 4px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
  }
  .bus-btn:hover { background: var(--accent-soft); }
  .bus-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .bus-btn.active { background: var(--accent); color: #fff; }
  .bus-btn .stopcount { font-weight: 400; font-size: 0.78rem; color: var(--muted); margin-left: 4px; }
  .bus-btn.active .stopcount { color: #cfe3da; }

  .map-area { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; }

  .map-status {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 7px 16px;
    font-size: 0.82rem;
    color: var(--muted);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    z-index: 1000;
    display: none;
  }

  .route-panel {
    position: absolute;
    bottom: 16px;
    left: 16px;
    right: 16px;
    max-width: 420px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    z-index: 1000;
    display: none;
  }
  .route-panel .bus-tag {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 3px 10px;
    border-radius: 6px;
    margin-bottom: 6px;
  }
  .route-panel p { margin: 0; font-size: 0.82rem; color: var(--muted); }

  @media (max-width: 720px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--line); }
    .map-area { flex: 1; min-height: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>Bus Routes</h1>
      <p>Tap a route to see it on the map</p>
    </div>
    <div class="setup-banner" id="setupBanner"></div>
    <div class="bus-list" id="busList"></div>
  </div>
  <div class="map-area">
    <div id="map"></div>
    <div class="map-status" id="mapStatus"></div>
    <div class="route-panel" id="routePanel"></div>
  </div>
</div>

const busListEl = document.getElementById('busList');
const mapStatusEl = document.getElementById('mapStatus');
const routePanelEl = document.getElementById('routePanel');
const setupBanner = document.getElementById('setupBanner');

let map = null;
let mapsReady = false;
let currentPolyline = null;
let currentMarkers = [];
let activeBtn = null;
const geocodeCache = {}; // origin string -> {lat, lng} | null

function showSetupWarning(msg) {
  setupBanner.style.display = 'block';
  setupBanner.textContent = msg;
}

function loadGoogleMaps() {
  if (!GOOGLE_MAPS_API_KEY || GOOGLE_MAPS_API_KEY === "YOUR_API_KEY_HERE") {
    showSetupWarning("This page isn't set up yet — add a Google Maps API key at the top of the script before it can load the map. See the comment in the source code.");
    return;
  }
  const script = document.createElement('script');
  script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&callback=onMapsLoaded`;
  script.async = true;
  script.onerror = () => showSetupWarning("Couldn't load Google Maps. Double-check the API key and that billing is enabled on the Google Cloud project.");
  document.head.appendChild(script);
}

window.onMapsLoaded = function () {
  mapsReady = true;
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 1.3521, lng: 103.8198 },
    zoom: 11,
    mapTypeControl: false,
    streetViewControl: false
  });
  buildSidebar();
  document.querySelectorAll('.bus-btn').forEach(b => b.disabled = false);
};

const geocoder = () => new google.maps.Geocoder();
let _geocoderInstance = null;

function geocodeOne(query) {
  if (geocodeCache[query] !== undefined) return Promise.resolve(geocodeCache[query]);
  if (!_geocoderInstance) _geocoderInstance = new google.maps.Geocoder();
  return new Promise((resolve) => {
    _geocoderInstance.geocode({ address: query, region: 'sg' }, (results, status) => {
      if (status === 'OK' && results && results.length > 0) {
        const loc = results[0].geometry.location;
        const coords = { lat: loc.lat(), lng: loc.lng() };
        geocodeCache[query] = coords;
        resolve(coords);
      } else {
        geocodeCache[query] = null;
        resolve(null);
      }
    });
  });
}

function setStatus(text) {
  mapStatusEl.style.display = text ? 'block' : 'none';
  mapStatusEl.textContent = text || '';
}

function clearRoute() {
  if (currentPolyline) { currentPolyline.setMap(null); currentPolyline = null; }
  currentMarkers.forEach(m => m.setMap(null));
  currentMarkers = [];
}

async function selectBus(busNo, btn) {
  if (!mapsReady) return;
  if (activeBtn) activeBtn.classList.remove('active');
  btn.classList.add('active');
  activeBtn = btn;

  clearRoute();
  routePanelEl.style.display = 'none';

  const stops = BUSES[busNo];
  const needsGeocode = stops.some(s => geocodeCache[s.origin] === undefined);
  if (needsGeocode) setStatus(`Loading Bus ${busNo} route…`);

  const coordResults = await Promise.all(stops.map(s => geocodeOne(s.origin)));
  setStatus('');

  const coordsList = [];
  coordResults.forEach((c, i) => {
    if (c) coordsList.push({ ...c, display: stops[i].display, idx: i });
  });

  if (coordsList.length === 0) {
    routePanelEl.style.display = 'block';
    routePanelEl.innerHTML = `<span class="bus-tag">Bus ${busNo}</span><p>Couldn't locate any stops for this route.</p>`;
    return;
  }

  const path = coordsList.map(c => ({ lat: c.lat, lng: c.lng }));
  currentPolyline = new google.maps.Polyline({
    path,
    geodesic: true,
    strokeColor: '#1e5c4a',
    strokeOpacity: 0.85,
    strokeWeight: 4,
    map
  });

  const bounds = new google.maps.LatLngBounds();
  const infoWindow = new google.maps.InfoWindow();

  coordsList.forEach((c, i) => {
    const marker = new google.maps.Marker({
      position: { lat: c.lat, lng: c.lng },
      map,
      label: { text: String(i + 1), color: '#fff', fontSize: '11px', fontWeight: '700' },
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 12,
        fillColor: '#1e5c4a',
        fillOpacity: 1,
        strokeColor: '#fff',
        strokeWeight: 2
      }
    });
    marker.addListener('click', () => {
      infoWindow.setContent(`<b>Stop ${i + 1}</b><br>${c.display}`);
      infoWindow.open(map, marker);
    });
    currentMarkers.push(marker);
    bounds.extend(marker.getPosition());
  });

  map.fitBounds(bounds, 60);

  const missing = stops.length - coordsList.length;
  routePanelEl.style.display = 'block';
  routePanelEl.innerHTML = `
    <span class="bus-tag">Bus ${busNo}</span>
    <p>${coordsList.length} stop${coordsList.length === 1 ? '' : 's'} shown${missing ? ` · ${missing} stop${missing === 1 ? '' : 's'} couldn't be located` : ''}. Click a pin for the stop name.</p>
  `;
}

function buildSidebar() {
  busListEl.innerHTML = '';
  Object.keys(BUSES).forEach(busNo => {
    const btn = document.createElement('button');
    btn.className = 'bus-btn';
    btn.disabled = !mapsReady;
    btn.innerHTML = `Bus ${busNo} <span class="stopcount">${BUSES[busNo].length} stops</span>`;
    btn.addEventListener('click', () => selectBus(busNo, btn));
    busListEl.appendChild(btn);
  });
}

// Build a disabled sidebar immediately so it's visible while Maps loads
buildSidebar();
loadGoogleMaps();
</script>
